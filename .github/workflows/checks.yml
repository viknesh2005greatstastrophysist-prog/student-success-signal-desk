name: checks

on:
  push:
    branches: [streamlit-college-project]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (lint, types, tests, engine bundle, DB suites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Lint and typecheck (Core)
        run: npm run lint --workspace=@aura/core-api && npm run typecheck --workspace=@aura/core-api
      - name: Platform tests
        run: npm test
      - name: Core tests
        run: npm run test:core
      - name: Streamlit engine bundle matches the source
        run: npm run check:engine
      # Synthetic seed only, each suite in its own disposable schema on the CI
      # Postgres. Never the project or hosted databases.
      - name: Core DB suites
        working-directory: platform/services/core-api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aura_ci
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/aura_ci
        run: |
          RUN_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_ci npx tsx --test tests/database.test.ts
          RUN_CH11_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_ch11_ci npx tsx --test tests/chapter11-database.test.ts
          RUN_CH11_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_ch11_agent_ci npx tsx --test tests/chapter11-agents-database.test.ts
          RUN_CH11_LEASE_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_ch11_lease_ci npx tsx --test tests/chapter11-lease-database.test.ts
          RUN_DEVICE_TOKEN_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_device_ci npx tsx --test tests/device-tokens.test.ts
          RUN_CONSISTENCY_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_consistency_ci npx tsx --test tests/data-consistency.test.ts
          RUN_INFORMATIONAL_DB_TESTS=1 CORE_DATABASE_SCHEMA=aura_core_test_informational_ci npx tsx --test tests/informational-database.test.ts

  streamlit:
    name: Streamlit offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: streamlit_app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r streamlit_app/requirements.txt
      - run: python streamlit_app/verify_draft_v2.py
      - run: python streamlit_app/verify_agent_trace.py
      - run: python streamlit_app/verify_read_cache.py
      - run: python streamlit_app/verify_ai_only_ui.py
      - run: python streamlit_app/verify_data_counts.py
      - run: python streamlit_app/verify_attendance_basis.py
      - run: python streamlit_app/verify_navigation.py
      - run: python streamlit_app/verify_bridge_pool.py
      - run: python streamlit_app/verify_device_signin.py
      - run: python streamlit_app/verify_drafted_by.py
      - run: python streamlit_app/verify_safety_fixes.py
      - run: python streamlit_app/verify_count_fixes.py
      - run: python streamlit_app/verify_informational_records.py
