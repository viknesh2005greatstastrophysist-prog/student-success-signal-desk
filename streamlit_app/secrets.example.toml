# Copy values privately into Streamlit Advanced settings. Never commit real values.
[aura]
AURA_HOSTED_COLLEGE_PROJECT = "1"
AURA_LOCAL_PROJECT = "0"
AURA_IDENTITY_MODE = "college-project"
CORE_IDENTITY_REALM = "college-project"
CORE_DATABASE_SCHEMA = "aura_hosted_project_core"
AUTH_DATABASE_SCHEMA = "aura_hosted_project_identity"
DATABASE_URL = "postgres://USER:PASSWORD@APPROVED_HOST/DATABASE?sslmode=verify-full"
DATABASE_URL_UNPOOLED = "postgres://USER:PASSWORD@APPROVED_HOST/DATABASE?sslmode=verify-full"
COLLEGE_DATABASE_HOST = "APPROVED_HOST"
COLLEGE_DATABASE_NAME = "DATABASE"

# Optional free Gemini connection; set only after verifying Free tier in AI Studio.
CH11_MODEL = "gemini-3.1-flash-lite"
CH11_MODEL_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
CH11_MODEL_API_KEY = "PRIVATE_EXISTING_GEMINI_KEY"
