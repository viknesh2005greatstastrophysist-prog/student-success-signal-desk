# AURA visual system: clear, quiet, Apple-like (docs/DESIGN_SYSTEM.md).
# Light only. Page #F5F5F7, surfaces #FFFFFF, text #1D1D1F / #6E6E73 / #86868B.
# backgroundColor is white on purpose: Streamlit paints table cells, menus and popovers with it,
# and those are surfaces. The page itself is painted #F5F5F7 by ui.CSS (--bg).
# One accent, Apple blue #0071E3: primary buttons, links and the active state.
# Status colours are used as a small dot plus a word, never as large fills:
# green #34C759 (fine), orange #FF9F0A (attention), red #FF3B30 (urgent).
# Streamlit's tone names map onto them: green = fine / done, orange and violet = attention,
# red = urgent / failed, blue = in progress, gray = neutral. The text tones below are the
# darker variants of the status colours so words stay readable on white (4.5:1 or better).

[theme]
base = "light"
primaryColor = "#0071E3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
linkColor = "#0071E3"
linkUnderline = false
borderColor = "#E3E3E8"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "full"
baseFontSize = 16
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "SF Mono, ui-monospace, Menlo, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.625rem", "1.375rem", "1.1875rem", "1.0625rem", "0.9375rem"]
metricValueFontWeight = 600
dataframeBorderColor = "#E3E3E8"
dataframeHeaderBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F5F5F7"
blueColor = "#0071E3"
blueBackgroundColor = "#EAF3FD"
blueTextColor = "#0071E3"
greenColor = "#34C759"
greenBackgroundColor = "#EAF8EE"
greenTextColor = "#1F8A3B"
orangeColor = "#FF9F0A"
orangeBackgroundColor = "#FFF4E0"
orangeTextColor = "#A35F00"
redColor = "#FF3B30"
redBackgroundColor = "#FFECEA"
redTextColor = "#D70015"
violetColor = "#FF9F0A"
violetBackgroundColor = "#FFF4E0"
violetTextColor = "#A35F00"
grayColor = "#86868B"
grayBackgroundColor = "#F0F0F3"
grayTextColor = "#6E6E73"
chartCategoricalColors = ["#0071E3", "#86868B", "#34C759", "#FF9F0A", "#FF3B30", "#1D1D1F"]
chartSequentialColors = ["#EAF3FD", "#CFE4FB", "#A9CEF7", "#7FB5F2", "#4F98EC", "#2A82E8", "#0071E3", "#0062C4", "#0053A5", "#004486"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E8E8ED"
textColor = "#1D1D1F"
primaryColor = "#0071E3"
borderColor = "#E3E3E8"
linkColor = "#0071E3"
codeBackgroundColor = "#F5F5F7"
grayTextColor = "#6E6E73"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
