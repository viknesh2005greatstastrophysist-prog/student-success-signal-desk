[project]
name = "student-success-case-manager"
version = "2.0.0"
description = "Governed, multi-stakeholder agentic student-success ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "openai>=1.66,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
student-success = "student_success.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student_success"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "acceptance: expected-outcome acceptance tests",
  "fault: crash and fault-injection tests",
]

[tool.coverage.run]
source = ["student_success"]
branch = true
omit = [
  "src/student_success/cli.py",
  "src/student_success/ui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]
