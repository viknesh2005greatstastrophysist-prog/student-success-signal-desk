# AURA visual system. Semantic colours follow the Chapter 11 node-graph legend:
# navy = coordinator, blue = specialist agents, amber (orange) = human gate,
# green = governed publish. Violet/gray/red are reserved for risk and attention.

[theme]
base = "light"
primaryColor = "#1B2A4A"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#FBFAF7"
textColor = "#14213D"
linkColor = "#2F6FB0"
linkUnderline = false
borderColor = "#E2DED5"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "8px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [650, 600, 600, 600, 600, 600]
headingFontSizes = ["2.5rem", "1.65rem", "1.25rem", "1.05rem", "0.95rem", "0.875rem"]
metricValueFontWeight = 600
dataframeBorderColor = "#E8E4DB"
dataframeHeaderBackgroundColor = "#F1EEE7"
codeBackgroundColor = "#F1EEE7"
blueColor = "#2F6FB0"
blueBackgroundColor = "#E7F0F9"
blueTextColor = "#1E5592"
greenColor = "#1F7A4D"
greenBackgroundColor = "#E4F3EA"
greenTextColor = "#17603C"
orangeColor = "#B7791F"
orangeBackgroundColor = "#FBF1DE"
orangeTextColor = "#7A4F0A"
redColor = "#B42318"
redBackgroundColor = "#FCEBE9"
redTextColor = "#981B12"
violetColor = "#6B3FA0"
violetBackgroundColor = "#F1EBF8"
violetTextColor = "#56327F"
grayColor = "#6B7280"
grayBackgroundColor = "#EEF0F3"
grayTextColor = "#4A5568"
chartCategoricalColors = ["#1B2A4A", "#2F6FB0", "#B7791F", "#1F7A4D", "#6B3FA0", "#B42318", "#8A94A6"]
chartSequentialColors = ["#E7F0F9", "#C9DCF0", "#A9C6E6", "#86AEDB", "#6496CC", "#467FBE", "#2F6FB0", "#255B93", "#1C4776", "#14335A"]

[theme.sidebar]
backgroundColor = "#1B2A4A"
secondaryBackgroundColor = "#24365C"
textColor = "#E9EDF5"
primaryColor = "#F2C46D"
borderColor = "#33476E"
linkColor = "#BFD6F2"
codeBackgroundColor = "#24365C"
grayTextColor = "#B8C2D6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
