# AURA "Signal" visual system: quiet paper, ink and one signal colour.
# paper #F4F1EA, surface #FBFAF6, ink #0E1116, ink-2 #3A3F47, hairline #E2DDD2.
# signal (vermilion) #FF5A1F = primary CTA and "needs you"; agent (cobalt) #2B59FF = anything the AI did.
# Risk bands: low #2F9E6F, medium #E5A200, high #E5484D. Streamlit tone names map onto them:
# blue = agent, orange = needs a human (signal), green = low / done, violet = medium risk,
# red = high / failed, gray = neutral. Primary stays ink so selection states are calm; the
# vermilion primary button is applied in ui.py (a single CTA per view).

[theme]
base = "light"
primaryColor = "#0E1116"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#FBFAF6"
textColor = "#0E1116"
linkColor = "#2B59FF"
linkUnderline = false
borderColor = "#E2DDD2"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "full"
baseFontSize = 15
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
headingFontWeights = [400, 400, 400, 600, 600, 600]
headingFontSizes = ["3.5rem", "2.25rem", "1.75rem", "1.0625rem", "0.9375rem", "0.75rem"]
metricValueFontWeight = 500
dataframeBorderColor = "#E2DDD2"
dataframeHeaderBackgroundColor = "#F4F1EA"
codeBackgroundColor = "#EFEBE1"
blueColor = "#2B59FF"
blueBackgroundColor = "#E8EDFF"
blueTextColor = "#1F3FBF"
greenColor = "#2F9E6F"
greenBackgroundColor = "#E2F3EA"
greenTextColor = "#1B6B49"
orangeColor = "#FF5A1F"
orangeBackgroundColor = "#FFEDE4"
orangeTextColor = "#B8360A"
redColor = "#E5484D"
redBackgroundColor = "#FCE6E7"
redTextColor = "#B3262B"
violetColor = "#E5A200"
violetBackgroundColor = "#FBF0CF"
violetTextColor = "#7A5600"
grayColor = "#5B6068"
grayBackgroundColor = "#ECE8DE"
grayTextColor = "#3A3F47"
chartCategoricalColors = ["#2B59FF", "#2F9E6F", "#E5A200", "#E5484D", "#0E1116", "#FF5A1F", "#8A8F98"]
chartSequentialColors = ["#EEF1FF", "#D3DCFF", "#B3C2FF", "#90A6FF", "#6C88FF", "#486BFF", "#2B59FF", "#2146CC", "#183499", "#102366"]

[theme.sidebar]
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#3A3F47"
textColor = "#F4F1EA"
primaryColor = "#FF5A1F"
borderColor = "#2A2F37"
linkColor = "#9DB1FF"
codeBackgroundColor = "#1A1F27"
grayTextColor = "#A8ADB6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
